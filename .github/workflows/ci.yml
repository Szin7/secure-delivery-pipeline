name: Secure Delivery CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    name: Tests and source security
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Run application and policy tests
        run: uv run --python 3.14 --locked python -m pytest -q

      - name: Install Semgrep
        run: uv tool install --python 3.14 "semgrep==1.185.0"

      - name: Check for exposed secrets
        run: ./scripts/check_secrets.sh

      - name: Run static analysis
        run: ./scripts/check_sast.sh

      - name: Upload source security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-security-reports
          path: |
            reports/gitleaks-history.json
            reports/gitleaks-working-tree.json
            reports/semgrep-sast.json
          if-no-files-found: warn
          retention-days: 14

  image-security:
    name: Build and image security
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build application image
        run: |
          docker build --platform linux/amd64 \
            -t secure-delivery-pipeline:local .

      - name: Smoke-test built image
        shell: bash
        run: |
          set -euo pipefail

          container="sdp-ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container" \
            --init \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --pids-limit 128 \
            secure-delivery-pipeline:local

          ready=0

          for attempt in $(seq 1 20); do
            if docker exec "$container" python -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" \
              >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" -ne 1 ]]; then
            docker logs "$container"
            echo "FAIL: Container did not become ready"
            exit 1
          fi

          docker exec "$container" python -c '
          import json
          from urllib.request import urlopen

          checks = {
              "/health": {"status": "ok"},
              "/version": {"version": "0.1.0"},
          }

          for path, expected in checks.items():
              with urlopen(
                  "http://127.0.0.1:8000" + path,
                  timeout=3,
              ) as response:
                  actual = json.load(response)

              if actual != expected:
                  raise SystemExit(f"FAIL [smoke]: {path}: {actual}")

              print(f"PASS [smoke]: {path}")
          '

          echo "PASS: Container smoke test completed"

      - name: Check image vulnerabilities
        run: ./scripts/check_image_vulns.sh

      - name: Check Dockerfile configuration
        run: ./scripts/check_config.sh

      - name: Generate and verify SBOM
        run: ./scripts/generate_sbom.sh

      - name: Record image identity
        run: |
          docker image inspect secure-delivery-pipeline:local \
            --format '{{.Id}}' > reports/image-id.txt

      - name: Upload image security evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-security-reports
          path: |
            reports/trivy-image-gate.json
            reports/trivy-config-gate.json
            reports/sbom-image.cdx.json
            reports/image-id.txt
          if-no-files-found: error
          retention-days: 14

      - name: Save scanned image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save -o "$RUNNER_TEMP/release-image.tar" secure-delivery-pipeline:local
          cd "$RUNNER_TEMP"
          sha256sum release-image.tar > release-image.tar.sha256

      - name: Upload scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scanned-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-image.tar
            ${{ runner.temp }}/release-image.tar.sha256
            reports/image-id.txt
          if-no-files-found: error
          retention-days: 3

  publish-image:
    name: Publish approved image
    needs: [source-security, image-security, release-policy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanned-image-${{ github.sha }}
          path: ${{ runner.temp }}/scanned-image

      - name: Verify and load scanned image
        shell: bash
        run: |
          set -euo pipefail

          root="$RUNNER_TEMP/scanned-image"

          mapfile -t archives < <(find "$root" -type f -name release-image.tar)
          mapfile -t checksums < <(find "$root" -type f -name release-image.tar.sha256)
          mapfile -t identities < <(find "$root" -type f -name image-id.txt)

          if [[ ${#archives[@]} -ne 1 ||
                ${#checksums[@]} -ne 1 ||
                ${#identities[@]} -ne 1 ]]; then
            echo "FAIL: Missing or duplicate release artifact files"
            exit 1
          fi

          archive_dir="$(dirname "${archives[0]}")"
          checksum_dir="$(dirname "${checksums[0]}")"

          if [[ "$archive_dir" != "$checksum_dir" ]]; then
            echo "FAIL: Archive and checksum are not together"
            exit 1
          fi

          (
            cd "$archive_dir"
            sha256sum --check release-image.tar.sha256
          )

          docker load --input "${archives[0]}"

          expected="$(cat "${identities[0]}")"
          actual="$(docker image inspect secure-delivery-pipeline:local --format '{{.Id}}')"

          if [[ "$expected" != "$actual" ]]; then
            echo "FAIL: Loaded image identity does not match scanned image"
            exit 1
          fi

          echo "PASS: Loaded image matches scanned image identity"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Publish image and record digest
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/${{ github.repository }}"
          image="${image,,}"
          tag="sha-${GITHUB_SHA}"

          docker tag secure-delivery-pipeline:local "$image:$tag"
          docker push "$image:$tag"

          digest="$(docker buildx imagetools inspect "$image:$tag" |
            awk '/^[[:space:]]*Digest:/ {print $2; exit}')"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "FAIL: Could not verify published registry digest"
            exit 1
          fi

          echo "$image@$digest" > "$RUNNER_TEMP/published-image-ref.txt"
          cat "$RUNNER_TEMP/published-image-ref.txt"

          echo "PASS: Published image digest verified"

      - name: Upload publication record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-reference-${{ github.sha }}
          path: ${{ runner.temp }}/published-image-ref.txt
          if-no-files-found: error
          retention-days: 14

  release-policy:
    name: Release configuration policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify approved release configuration
        run: python3 scripts/check_release_policy.py

      - name: Verify unsafe configuration is rejected
        shell: bash
        run: |
          set -euo pipefail

          fixture="$(mktemp "$RUNNER_TEMP/unsafe-release-XXXXXX.yaml")"
          trap 'rm -f "$fixture"' EXIT

          sed 's/read_only: true/read_only: false/' \
            deploy/compose.release.yaml > "$fixture"

          if cmp -s "$fixture" deploy/compose.release.yaml; then
            echo "FAIL: Negative test fixture was not modified"
            exit 1
          fi

          if python3 scripts/check_release_policy.py "$fixture" \
              > "$RUNNER_TEMP/release-rejection.log" 2>&1; then
            echo "FAIL: Unsafe release configuration was accepted"
            exit 1
          fi

          cat "$RUNNER_TEMP/release-rejection.log"

          grep -Fq 'BLOCK [release]: Read-only filesystem required' \
            "$RUNNER_TEMP/release-rejection.log"

          echo "PASS: Unsafe release configuration rejected"
